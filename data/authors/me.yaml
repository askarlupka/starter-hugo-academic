experience:
  - role: Senior Program Manager
    org: Vivli
    start: 2025-04-01
    summary: |
      Lead member engagement and strategic planning for the AMR Register, a
      global repository for antimicrobial resistance surveillance data.
      Subject matter expert in data governance and international data sharing
      (FAIR principles, EHDS). Founded and lead Vivli's Office of Program
      Management, driving metrics-driven, data-informed decisions across a
      portfolio of active projects, and contribute to the NIH-funded GREI
      initiative on AI metadata curation and data standards.
  - role: Health Scientist Administrator – Program Officer
    org: National Cancer Institute (NCI)
    start: 2024-06-01
    end: 2025-04-30
    summary: |
      Built the data science and AI research program for the Division of
      Cancer Prevention. Managed grants, contracts, and interagency
      agreements, published funding opportunities, and served as Executive
      Secretary for the NIH GREI Council of Councils Working Group. Two-time
      NCI Director's Award recipient.
  - role: Presidential Management Fellow
    org: National Institutes of Health
    start: 2022-06-01
    end: 2024-06-30
    summary: |
      Selected from 6,800 applicants for the federal government's premier
      leadership development program. Evaluated data resources and data
      science programs across NCI and the NIH Office of Data Science
      Strategy, and authored an AI "Bold Prediction" incorporated into the
      NIH-wide Strategic Plan.
  - role: Computational Researcher & Statistician
    org: University of Georgia
    start: 2020-01-01
    end: 2022-05-31
    summary: |
      Conducted independent computational research quantifying the breadth
      of influenza vaccine protection, using multidimensional scaling, PCA,
      and machine learning on a high-performance computing cluster.
  - role: Experimental Researcher
    org: University of Georgia, College of Veterinary Medicine
    start: 2018-01-01
    end: 2022-05-31
    summary: |
      Designed and published preclinical evidence for broadly protective
      influenza vaccine candidates, computationally designed vaccine
      components (patent pending), and conducted research in a BSL-3
      facility.
  - role: Associate Research Specialist
    org: Food Research Institute, University of Wisconsin–Madison
    start: 2014-07-01
    end: 2016-07-31
    summary: |
      Designed and ran pathogen growth and thermal-inactivation studies for
      industry clients, authored protocols, analyzed results, and briefed
      stakeholders.

