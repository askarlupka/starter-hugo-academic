bio: |
  I'm an infectious disease and data scientist advancing public health
  through ethical, FAIR, and impactful data sharing. At Vivli, I lead
  member engagement and strategic planning for the Antimicrobial
  Resistance (AMR) Register and serve as a subject matter expert in data
  governance and international data sharing. My work bridges researchers,
  clinicians, and data scientists to drive innovation in health equity,
  AI ethics, and open science.

